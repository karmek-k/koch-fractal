<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Koch Fractal</title>
        <link rel="stylesheet" href="/style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <header class="header">
            <h1 class="header__title">Koch Fractal</h1>
        </header>
        <main>
            <div class="fractal">
                <canvas
                    class="fractal__canvas"
                    id="koch-canvas"
                    width="1200"
                    height="400"
                ></canvas>
                <input
                    class="fractal__slider"
                    id="slider"
                    type="range"
                    min="1"
                    max="5"
                    value="1"
                />
            </div>
        </main>
        <script src="/koch.js"></script>
    </body>
</html>

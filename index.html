<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Koch Fractal</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <header>
            <h1>Koch Fractal</h1>
        </header>
        <main>
            <div class="fractal">
                <canvas
                    class="fractal__canvas"
                    id="koch-canvas"
                    width="1200"
                    height="400"
                ></canvas>
                <input
                    class="fractal__slider"
                    id="slider"
                    type="range"
                    min="1"
                    max="5"
                    value="1"
                />
            </div>
        </main>
        <script src="/koch.js"></script>
    </body>
</html>
